<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210" fill="none" role="img"><title>DISCORD</title><style>@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.blink{animation:blink 1.1s steps(1) infinite}.top{animation:press 3.6s infinite;animation-delay:1.2s}@keyframes press{0%,8%,18%,100%{transform:translateY(0)}11%,14%{transform:translateY(9px)}}.side{transform-box:fill-box;transform-origin:bottom;animation:side 3.6s infinite;animation-delay:1.2s}@keyframes side{0%,8%,18%,100%{transform:scaleY(1)}11%,14%{transform:scaleY(.25)}}.flash{opacity:0;animation:flash 3.6s infinite;animation-delay:1.2s}@keyframes flash{0%,9%,30%,100%{opacity:0}12%{opacity:1}}.tag{animation:pulse 2s ease-in-out infinite}</style><defs><image id="ic" x="-.5" y="-.5" width="1" height="1" href="data:image/svg+xml;base64,"/>
