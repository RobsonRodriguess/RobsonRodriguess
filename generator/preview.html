<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>README preview</title>
<base href="/" />
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3; font: 16px/1.5 -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 830px; margin: 32px auto; padding: 32px; border: 1px solid #30363d; border-radius: 6px; }
  img { max-width: 100%; }
  a { color: #4493f8; }
</style>
</head>
<body>
<!-- Mostra o README como HTML cru, com a mesma largura da página de perfil do GitHub. -->
<main id="readme"></main>
<script>
  fetch("/README.md", { cache: "no-store" })
    .then((r) => r.text())
    .then((md) => { document.getElementById("readme").innerHTML = md; });
</script>
</body>
</html>
